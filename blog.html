<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | Neural Syntax</title>
    <style>
      /* THEME VARIABLES */
      :root {
        --bg-dark: #0d1117;
        --card-bg: #161b22;
        --text-primary: #c9d1d9;
        --text-secondary: #8b949e;
        --accent-blue: #58a6ff;
        --border-color: #30363d;
        --hover-border: #58a6ff;
      }

      /* GLOBAL STYLES */
      body {
        background-color: var(--bg-dark);
        color: var(--text-primary);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        margin: 0;
        padding: 0;
        line-height: 1.6;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      /* HEADER */
      header {
        text-align: center;
        margin-bottom: 60px;
      }

      header h1 {
        font-size: 2.8rem;
        margin-bottom: 10px;
        color: #fff;
        letter-spacing: -1.5px;
      }

      header p {
        color: var(--text-secondary);
        font-size: 1.1rem;
      }

      .back-link {
        color: var(--accent-blue);
        text-decoration: none;
        font-weight: 500;
        display: inline-block;
        margin-top: 15px;
        transition: color 0.2s;
      }

      .back-link:hover {
        color: #79c0ff;
        text-decoration: underline;
      }

      /* GRID SYSTEM */
      #blog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 30px;
      }

      /* POST CARDS */
      .post-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        overflow: hidden;
        transition:
          transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
          border-color 0.3s ease;
        display: flex;
        flex-direction: column;
        text-decoration: none;
        color: inherit;
      }

      .post-card:hover {
        transform: translateY(-10px);
        border-color: var(--hover-border);
      }

      /* HIGH-RES BANNER FIX */
      .post-banner {
        width: 100%;
        height: 220px;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-color: #000;
        border-bottom: 1px solid var(--border-color);

        /* CSS Sharpness rendering */
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
      }

      /* CARD CONTENT */
      .post-content {
        padding: 25px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }

      .post-content h2 {
        margin: 0 0 12px 0;
        font-size: 1.4rem;
        color: #fff;
        line-height: 1.3;
      }

      .post-content p {
        font-size: 1rem;
        color: var(--text-secondary);
        margin-bottom: 20px;
        flex-grow: 1;
      }

      .read-more-btn {
        color: var(--accent-blue);
        font-weight: 600;
        font-size: 0.95rem;
        display: flex;
        align-items: center;
      }

      /* LOADING STATE */
      .loader {
        grid-column: 1 / -1;
        text-align: center;
        padding: 100px 0;
        font-size: 1.2rem;
        color: var(--accent-blue);
        font-family: monospace;
      }

      @media (max-width: 768px) {
        #blog-grid {
          grid-template-columns: 1fr;
        }
        header h1 {
          font-size: 2.2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Neural Syntax Blog</h1>
        <p>Decoding code, AI, and digital logic.</p>
        <a href="index.html" class="back-link">← Back to Home</a>
      </header>

      <div id="blog-grid">
        <div class="loader">[ EXECUTE: FETCH_POSTS ] ...</div>
      </div>
    </div>

    <script>
      // CONFIGURATION
      const BLOG_URL = "https://neuralsyntaxofficial.blogspot.com";
      const POSTS_TO_SHOW = 12;

      function initBlog() {
        const script = document.createElement("script");
        // JSONP callback to handle cross-origin requests
        script.src = `${BLOG_URL}/feeds/posts/default?alt=json-in-script&max-results=${POSTS_TO_SHOW}&callback=renderPosts`;
        document.body.appendChild(script);
      }

      function renderPosts(data) {
        const grid = document.getElementById("blog-grid");
        grid.innerHTML = "";

        if (!data.feed.entry) {
          grid.innerHTML = '<div class="loader"> ERROR: NO_DATA_FOUND </div>';
          return;
        }

        data.feed.entry.forEach((entry) => {
          const title = entry.title.$t;
          const postUrl = entry.link.find((l) => l.rel === "alternate").href;

          // --- ADVANCED IMAGE RESOLUTION LOGIC ---
          let highResImg = "";
          if (entry.media$thumbnail) {
            let rawThumb = entry.media$thumbnail.url;

            // Regex replacement to force original high-res size (s1600)
            // Matches patterns like /s72-c/ or /w100-h100-p/
            highResImg = rawThumb.replace(/\/s[0-9]+(-[a-z])?\//, "/s1600/");

            // Fallback for newer Google static content URLs
            if (highResImg.includes("=")) {
              highResImg = highResImg.split("=")[0] + "=s1600";
            }
          } else {
            // Fallback image if post has no cover
            highResImg =
              "https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=1600&q=80";
          }

          // --- TEXT SNIPPET LOGIC ---
          let summary = entry.summary ? entry.summary.$t : entry.content.$t;
          // Strips HTML tags and limits text to 130 characters
          let cleanSummary =
            summary.replace(/<[^>]*>?/gm, "").substring(0, 130) + "...";

          const cardHTML = `
                    <a href="${postUrl}" target="_blank" class="post-card">
                        <div class="post-banner" style="background-image: url('${highResImg}')"></div>
                        <div class="post-content">
                            <h2>${title}</h2>
                            <p>${cleanSummary}</p>
                            <span class="read-more-btn">Read Entry →</span>
                        </div>
                    </a>
                `;
          grid.innerHTML += cardHTML;
        });
      }

      // Run when window finishes loading
      window.onload = initBlog;
    </script>
  </body>
</html>
